# Gera o instalador e a versão portátil para Windows e anexa à Release quando uma tag vX.Y.Z é enviada.
name: Executável (Windows)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Atualizar preços (poe.ninja)
        run: npm run prices:update
        continue-on-error: true
      - run: npm test
      - run: npm run build
      # Gera sem publicar: o electron-builder publicando os dois alvos em paralelo criava Releases duplicadas.
      - run: npx electron-builder --win --publish never
      - name: Publicar Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes \
            release/*.exe release/*.blockmap release/latest.yml
